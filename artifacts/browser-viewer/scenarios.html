<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>SO-ARM101 tabletop trials</title>
<style>
:root{color-scheme:dark;font:16px/1.45 Inter,"DejaVu Sans",sans-serif;background:#111613;color:#e5eee7}
*{box-sizing:border-box}body{margin:0}main{max-width:1400px;margin:auto;padding:26px clamp(14px,3vw,46px) 42px}
a{color:#b6e7c6;text-underline-offset:3px}header,nav,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header{justify-content:space-between}header p{font-size:.85rem;color:#b5c8b9}
h1{font-size:clamp(1.8rem,4vw,3.1rem);letter-spacing:-.035em;line-height:1.08;margin:27px 0 6px}
h2{font-size:1.05rem;margin:0}.criteria{margin:0 0 22px;color:#bfd1c4}
nav{gap:4px}nav a,select,button{color:#e2ece5;background:#222c25;border:1px solid #45564a;border-radius:5px;padding:6px 11px;font:inherit;font-size:.88rem}
nav a{text-decoration:none}nav a[aria-current="page"],button:hover{background:#b9edca;color:#132217}
select{max-width:100%}button{cursor:pointer}.controls{justify-content:space-between;margin-bottom:14px}.controls label{font-size:.82rem;color:#adbdaf}
#summary{font-variant-numeric:tabular-nums}.pass{color:#b3edbf}.fail{color:#ffaf90}
.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(285px,1fr);gap:14px}
#cameras{display:grid;grid-template-columns:1fr 1fr;gap:7px}
figure{position:relative;margin:0;background:#161e19;border:1px solid #3b4c40;border-radius:6px;overflow:hidden}
figure img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}
figcaption{position:absolute;bottom:7px;left:7px;font-size:.77rem;background:#101812dd;padding:2px 7px;border-radius:3px}
aside{border:1px solid #39483d;border-radius:6px;display:flex;flex-direction:column;min-height:220px;min-width:0;overflow:hidden}
aside h2{padding:12px 14px;border-bottom:1px solid #354138}
#log{flex:1;min-height:0;overflow:auto;height:0;padding:0 14px;scrollbar-color:#4d6152 transparent}
article{padding:9px 0;border-bottom:1px solid #2a362d;overflow-wrap:anywhere;font-size:.9rem}
article small{display:block;color:#adcab8;font-size:.72rem;margin-bottom:3px}article[data-kind="command"]{font-family:monospace;color:#c2dae9}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0}input[type=range]{flex:1;min-width:80px;accent-color:#b5eac6}
#frameLabel{font-size:.8rem;color:#b9cabd;font-variant-numeric:tabular-nums}#result{color:#ceded1}
[hidden]{display:none!important}a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #99e0af}
@media(max-width:800px){.grid{grid-template-columns:1fr}aside{height:280px}}
</style>
<main>
<header><a href="/">← All tasks</a><nav aria-label="Tabletop task"><a href="#button" id="button">Red button</a><a href="#crocodile" id="crocodile">Crocodile</a></nav></header>
<h1 id="title">Press the red button</h1><p class="criteria" id="criteria"></p>
<div class="controls"><label>Recorded trial <select id="trials" aria-label="Recorded trial"></select></label><strong id="summary" role="status"></strong></div>
<div class="grid" id="workspace" hidden>
<div><section id="cameras" aria-label="Recorded camera views"></section>
<div class="player"><button id="play" type="button">Play frames</button><input type="range" id="frame" min="1" value="1" aria-label="Camera frame"><span id="frameLabel"></span><button id="latest" type="button">Latest</button></div></div>
<aside><h2>Codex output</h2><div id="log" role="log" aria-label="Run events" tabindex="0"></div></aside>
</div>
<p id="result"></p><a id="evidence" hidden>Verified result JSON</a> <a id="movie" hidden style="margin-left:1rem">Watch MP4</a>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const tasks={
  button:["Press the red button","The button must flash when the gripper presses it."],
  crocodile:["Place the crocodile in the rectangle","The entire toy must settle inside the marked rectangle."]
};
let run="", state=null, frame=0, follow=true, timer=null, logLength=-1, listKey="", request=0;
function task(){return location.hash==="#crocodile"?"crocodile":"button";}
function base(){return "/scenarios/"+task()+"/"+encodeURIComponent(run)+"/";}
function stop(){clearInterval(timer);timer=null;$("play").textContent="Play frames";}
function reset(){stop();state=null;frame=0;follow=true;logLength=-1;$("cameras").replaceChildren();$("log").replaceChildren();$("result").textContent="";$("evidence").hidden=true;$("movie").hidden=true;$("workspace").hidden=true;}
function showFrame(n){
  if(!state || !state.seq)return;
  const cameras=state.cameras || [], area=$("cameras");
  if(frame===n && area.children.length===cameras.length)return;
  frame=n;$("frame").value=n;$("frameLabel").textContent="Frame "+n+" / "+state.seq;
  if(area.children.length!==cameras.length){
    area.replaceChildren(...cameras.map(name=>{
      const box=document.createElement("figure"),im=document.createElement("img"),cap=document.createElement("figcaption");
      im.alt=name+" camera";cap.textContent=name[0].toUpperCase()+name.slice(1);box.append(im,cap);return box;
    }));
  }
  cameras.forEach((name,i)=>{area.children[i].firstChild.src=base()+"frames/"+String(n).padStart(5,"0")+"/"+encodeURIComponent(name)+".jpg";});
}
function selectRun(value){if(run!==value){reset();run=value;}}
function describe(s){
  const phase=s.phase==="finished"?(s.success?"Passed":"Failed"):s.phase;
  const elapsed=s.finished_at || !s.started_at?s.duration_seconds:Math.max(s.duration_seconds||0,(Date.now()-Date.parse(s.started_at))/1000);
  const wall=elapsed==null?"":Math.floor(elapsed/60)+"m "+Math.floor(elapsed%60)+"s";
  return [phase && phase[0].toUpperCase()+phase.slice(1),wall].filter(Boolean).join(" · ");
}
async function refresh(){
  const stamp=++request, active=task();
  try {
    const all=await (await fetch("/api/scenarios",{cache:"no-store"})).json();
    if(stamp!==request)return;
    const entries=all.filter(x=>x.task===active), key=JSON.stringify(entries.map(x=>[x.run_id,x.phase,x.success]));
    if(key!==listKey){
      const was=run || new URLSearchParams(location.search).get("run");
      $("trials").replaceChildren(...entries.map(x=>{
        const o=document.createElement("option");o.value=x.run_id;
        o.textContent=x.model+" · "+x.reasoning_effort+" · "+(x.started_at?new Date(x.started_at).toLocaleTimeString():x.run_id);
        return o;
      }));listKey=key;
      selectRun(entries.some(x=>x.run_id===was)?was:entries[0]?.run_id||"");$("trials").value=run;
    }
    if(!run){$("summary").textContent="Waiting for a trial";return;}
    const s=await (await fetch(base()+"status.json",{cache:"no-store"})).json();
    if(stamp!==request)return;
    const movie=entries.find(x=>x.run_id===run)?.replay_url;
    $("movie").hidden=!movie;if(movie)$("movie").href=movie;
    state=s;$("workspace").hidden=false;$("summary").textContent=describe(s);
    $("summary").className=s.success===true?"pass":s.success===false?"fail":"";
    $("result").textContent=s.result||s.caption||"";
    $("evidence").hidden=s.phase!=="finished";$("evidence").href=base()+"result.json";
    $("frame").max=Math.max(1,s.seq||0);if(s.seq)showFrame(follow?s.seq:Math.min(frame||1,s.seq));
    const events=s.events||[], log=$("log");
    if(events.length!==logLength){
      const nearBottom=logLength<0 || log.scrollHeight-log.clientHeight-log.scrollTop<48;
      for(const e of events.slice(Math.max(0,logLength))){
        const row=document.createElement("article"),head=document.createElement("small");
        head.textContent=[e.kind,"Decision "+e.decision,e.time&&new Date(e.time).toLocaleTimeString()].filter(Boolean).join(" · ");
        row.dataset.kind=e.kind;row.append(head,document.createTextNode(e.text));log.append(row);
      }
      logLength=events.length;if(nearBottom)log.scrollTop=log.scrollHeight;
    }
  } catch(error){if(stamp===request)$("summary").textContent="Reconnecting…";}
}
function openTask(){run="";listKey="";reset();const active=task();$("title").textContent=tasks[active][0];$("criteria").textContent="SO-ARM101 · MuJoCo · "+tasks[active][1];for(const id of Object.keys(tasks))$(id).setAttribute("aria-current",id===active?"page":"false");refresh();}
$("frame").oninput=()=>{stop();follow=false;showFrame(Number($("frame").value));};
$("latest").onclick=()=>{stop();follow=true;showFrame(state?.seq||1);};
$("play").onclick=()=>{if(timer){stop();return;}if(!state?.seq)return;follow=false;if(frame>=state.seq)showFrame(1);
  $("play").textContent="Pause";timer=setInterval(()=>{if(frame>=state.seq){stop();return;}showFrame(frame+1);},220);};
$("trials").onchange=()=>{selectRun($("trials").value);refresh();};
window.addEventListener("hashchange",openTask);openTask();setInterval(refresh,1800);
</script>
</html>
